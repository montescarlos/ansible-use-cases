---
- name: UC-01 - Prueba de conexion AWX a Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: Verificar conectividad con Windows
      ansible.windows.win_ping:

    - name: Consultar identidad del servidor
      ansible.windows.win_shell: |
        hostname
        whoami
      register: windows_info

    - name: Mostrar resultado
      ansible.builtin.debug:
        var: windows_info.stdout_lines
