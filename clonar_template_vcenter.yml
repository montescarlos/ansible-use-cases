
---
- name: UC-01 - Aprovisionamiento de VM VMware
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_template: "TPL-WIN2022-ANSIBLE"
    vm_datacenter: "MOS"
    vm_datastore: "ESX01SSD02"
    vm_folder: "/MOS/vm/POC"
    vm_network: "VM Network"

  tasks:

    - name: Validar parametros del Survey
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name | length > 0
          - vm_esxi is defined
          - vm_esxi | length > 0
          - vm_cpu is defined
          - vm_cpu | int >= 1
          - vm_cpu | int <= 16
          - vm_ram is defined
          - vm_ram | int >= 2
          - vm_ram | int <= 64
          - vm_disk is defined
          - vm_disk | int >= 200
          - vm_hostname is defined
          - vm_hostname | length >= 1
          - vm_hostname | length <= 15
          - vm_ip is defined
          - vm_ip | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - vm_netmask is defined
          - vm_netmask | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - vm_gateway is defined
          - vm_gateway | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - vm_dns1 is defined
          - vm_gateway | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - vm_dns2 is defined
          - vm_dns2 | default('') | length == 0 or (vm_dns2 |regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$'))
          - vm_admin_password is defined
          - vm_admin_password | length > 0
        fail_msg: "Parametros de aprovisionamiento invalidos"
        success_msg: "Parametros del Survey validados correctamente"


    - name: Desplegar maquina virtual
      community.vmware.vmware_guest:
        datacenter: "{{ vm_datacenter }}"
        esxi_hostname: "{{ vm_esxi }}"
        datastore: "{{ vm_datastore }}"
        folder: "{{ vm_folder }}"
        name: "{{ vm_name }}"
        template: "{{ vm_template }}"
        state: poweredon

        hardware:
          num_cpus: "{{ vm_cpu | int }}"
          memory_mb: "{{ (vm_ram | int) * 1024 }}"

        disk:
          - size_gb: "{{ vm_disk | int }}"
            type: thin

        networks:
          - name: "{{ vm_network }}"
            type: static
            ip: "{{ vm_ip }}"
            netmask: "{{ vm_netmask }}"
            gateway: "{{ vm_gateway }}"
            dns_servers: >-
              {{
                [vm_dns1] +
                ([vm_dns2] if (vm_dns2 | default('') | length > 0) else [])
              }}
            start_connected: true

        customization:
          hostname: "{{ vm_hostname }}"
          joinworkgroup: WORKGROUP
          password: "{{ vm_admin_password }}"

        wait_for_customization: true
        wait_for_customization_timeout: 1800

        wait_for_ip_address: true
        wait_for_ip_address_timeout: 600

      register: deploy_result
      no_log: true

    - name: Mostrar resultado del aprovisionamiento
      ansible.builtin.debug:
        msg:
          - "Aprovisionamiento finalizado"
          - "VM: {{ vm_name }}"
          - "Hostname Windows: {{ vm_hostname }}"
          - "Host ESXi: {{ vm_esxi }}"
          - "CPU: {{ vm_cpu }} vCPU"
          - "RAM: {{ vm_ram }} GB"
          - "Disco: {{ vm_disk }} GB (Thin Provisioning)"
          - "Red: {{ vm_network }}"
          - "IP configurada: {{ vm_ip }}"
          - "Gateway: {{ vm_gateway }}"
          - "DNS primario: {{ vm_dns1 }}"
          - "DNS secundario: {{ vm_dns2 }}"
          - "Estado: {{ deploy_result.instance.hw_power_status }}"
