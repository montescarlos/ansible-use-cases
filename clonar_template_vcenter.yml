---
- name: Diagnosticar ubicacion de plantilla VMware
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Consultar informacion de la plantilla
      community.vmware.vmware_guest_info:
        datacenter: MOS
        name: TPL-WIN2022-ANSIBLE
      register: template_info

    - name: Mostrar datos relevantes
      ansible.builtin.debug:
        msg:
          - "Host: {{ template_info.instance.hw_esxi_host }}"
          - "Carpeta: {{ template_info.instance.hw_folder }}"
          - "Datastore: {{ template_info.instance.hw_datastores }}"
          - "Ruta VMX: {{ template_info.instance.hw_files }}"
