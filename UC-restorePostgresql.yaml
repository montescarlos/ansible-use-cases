---
- name: Restore PostgreSQL - reemplazar Empresa desde ultimo backup
  hosts: all
  gather_facts: false
  become: true
  become_method: sudo
  become_user: postgres

  tasks:
    - name: Buscar ultimo backup
      ansible.builtin.find:
        paths: /var/backups/postgresql
        patterns: 'postgresql_*.sql.gz'
        file_type: file
        recurse: false
      register: backups
      failed_when: (backups.matched | default(0) | int) == 0

    - name: Borrar y restaurar la base Empresa
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        temporal=$(mktemp /tmp/restore-Empresa.XXXXXX.sql)
        trap 'rm -f "$temporal"' EXIT

        echo "Backup seleccionado: $BACKUP_FILE"
        gzip -t "$BACKUP_FILE"

        # Extraer SOLO las instrucciones de Empresa del pg_dumpall.
        # Se valida la extraccion ANTES de borrar la base actual.
        gzip -dc "$BACKUP_FILE" | awk '
          /^-- Database "Empresa" dump$/ { en_empresa=1; next }
          /^-- Database "/ { if (en_empresa) en_empresa=0; next }
          en_empresa && /^\\connect[[:space:]]/ {
            if (iniciado) {
              print "ERROR: conexion adicional inesperada" > "/dev/stderr"
              exit 3
            }
            iniciado=1
            next
          }
          en_empresa && iniciado { print; lineas++ }
          END {
            if (!iniciado || lineas == 0) {
              print "ERROR: no se encontro la seccion SQL de Empresa" > "/dev/stderr"
              exit 2
            }
          }
        ' > "$temporal"

        grep -Fq 'COPY public."Personas" (' "$temporal" || {
          echo 'ERROR: este backup no contiene la carga de Personas; no se borra Empresa.' >&2
          exit 1
        }

        echo 'Eliminando solamente la base Empresa...'
        /bin/psql -X -v ON_ERROR_STOP=1 -d postgres -c 'DROP DATABASE IF EXISTS "Empresa" WITH (FORCE);'
        /bin/createdb -T template0 Empresa

        echo 'Restaurando Empresa desde el backup...'
        /bin/psql -X -v ON_ERROR_STOP=1 -d Empresa -f "$temporal"
        echo 'Registros restaurados en Empresa:'
        /bin/psql -X -v ON_ERROR_STOP=1 -d Empresa -c 'SELECT COUNT(*) FROM public."Personas";'
      args:
        executable: /bin/bash
      environment:
        BACKUP_FILE: "{{ (backups.files | sort(attribute='mtime', reverse=true) | first).path }}"
      register: restore_result

    - name: Mostrar resultado en AWX
      ansible.builtin.debug:
        var: restore_result.stdout_lines
