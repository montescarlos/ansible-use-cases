---
# AWX / Git: respaldar todo PostgreSQL en 192.168.110.96.
# Conexion SSH: manager (credencial Machine de AWX).
# Todas las tareas remotas se ejecutan como postgres mediante sudo.
# Preparacion inicial (una sola vez, por root): crear /var/backups/postgresql
# con propietario postgres:postgres, modo 0700, y configurar sudo manager->postgres.
- name: Respaldo completo PostgreSQL ejecutado como postgres
  hosts: postgresql
  gather_facts: false
  become: true
  become_method: sudo
  become_user: postgres

  vars:
    pg_backup_dir: /var/backups/postgresql
    pg_backup_retention_days: 7
    pg_backup_port: 5432
    pg_backup_dumpall_path: /bin/pg_dumpall

  tasks:
    - name: Validar parametros del respaldo
      ansible.builtin.assert:
        that:
          - pg_backup_dir is match('^/.+')
          - pg_backup_retention_days | int >= 1
          - pg_backup_port | int >= 1
          - pg_backup_port | int <= 65535
        fail_msg: Verifique directorio, retencion y puerto PostgreSQL.

    - name: Confirmar que Ansible ejecuta comandos como postgres
      ansible.builtin.command:
        argv:
          - id
          - -un
      register: pg_usuario_efectivo
      changed_when: false

    - name: Verificar usuario efectivo postgres
      ansible.builtin.assert:
        that:
          - pg_usuario_efectivo.stdout | trim == 'postgres'
        fail_msg: El proceso remoto debe ejecutarse como postgres, no como manager ni root.

    - name: Comprobar directorio preparado para respaldos
      ansible.builtin.stat:
        path: "{{ pg_backup_dir }}"
      register: pg_directorio

    - name: Validar directorio seguro y propiedad de postgres
      ansible.builtin.assert:
        that:
          - pg_directorio.stat.exists | default(false)
          - pg_directorio.stat.isdir | default(false)
          - pg_directorio.stat.pw_name | default('') == 'postgres'
          - pg_directorio.stat.mode | default('') == '0700'
        fail_msg: >-
          Prepare una sola vez como root: install -d -o postgres -g postgres
          -m 0700 {{ pg_backup_dir }}. El playbook no necesita root.

    - name: Comprobar ejecutable fijo de pg_dumpall
      ansible.builtin.stat:
        path: "{{ pg_backup_dumpall_path }}"
      register: pg_dumpall_info

    - name: Validar que pg_dumpall es ejecutable
      ansible.builtin.assert:
        that:
          - pg_dumpall_info.stat.exists | default(false)
          - pg_dumpall_info.stat.executable | default(false)
        fail_msg: No se puede ejecutar /bin/pg_dumpall como postgres.

    - name: Obtener version del cliente pg_dumpall
      ansible.builtin.command:
        argv:
          - "{{ pg_backup_dumpall_path }}"
          - --version
      register: pg_cliente_version
      changed_when: false

    - name: Verificar acceso local al servidor PostgreSQL
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -A
          - -t
          - --no-password
          - -p
          - "{{ pg_backup_port | string }}"
          - -c
          - 'SHOW server_version;'
      register: pg_servidor_version
      changed_when: false

    - name: Obtener marca de tiempo UTC
      ansible.builtin.command:
        argv:
          - date
          - -u
          - +%Y%m%dT%H%M%S%NZ
      register: pg_fecha
      changed_when: false

    - name: Definir nombre del archivo de respaldo
      ansible.builtin.set_fact:
        pg_archivo: "{{ pg_backup_dir }}/postgresql_all_{{ pg_fecha.stdout }}.sql.gz"

    - name: Respaldar todas las bases y roles a un archivo comprimido
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            umask 077
            dumpall="$1"
            backup_dir="$2"
            destino="$3"
            puerto="$4"
            temporal="$(mktemp "${backup_dir}/.postgresql_all_XXXXXXXX")"
            trap 'rm -f -- "$temporal"' EXIT
            "$dumpall" --no-password --no-role-passwords --port "$puerto" | gzip -c > "$temporal"
            gzip -t -- "$temporal"
            test -s "$temporal"
            mv -- "$temporal" "$destino"
            trap - EXIT
          - backup_postgresql
          - "{{ pg_backup_dumpall_path }}"
          - "{{ pg_backup_dir }}"
          - "{{ pg_archivo }}"
          - "{{ pg_backup_port | string }}"
      register: pg_backup_resultado
      changed_when: true

    - name: Revisar archivo generado
      ansible.builtin.stat:
        path: "{{ pg_archivo }}"
      register: pg_estado_archivo

    - name: Validar existencia y permisos del respaldo
      ansible.builtin.assert:
        that:
          - pg_estado_archivo.stat.exists | default(false)
          - pg_estado_archivo.stat.isreg | default(false)
          - pg_estado_archivo.stat.size | default(0) | int > 0
          - pg_estado_archivo.stat.mode | default('') == '0600'
          - pg_estado_archivo.stat.pw_name | default('') == 'postgres'
        fail_msg: El respaldo no supera la validacion de archivo, tamano, permisos o propietario.

    - name: Buscar respaldos con mas de siete dias
      ansible.builtin.find:
        paths: "{{ pg_backup_dir }}"
        patterns: 'postgresql_all_*.sql.gz'
        file_type: file
        age: "{{ pg_backup_retention_days }}d"
        recurse: false
      register: pg_backups_antiguos

    - name: Eliminar respaldos vencidos tras crear uno correcto
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pg_backups_antiguos.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Mostrar resultado en AWX
      ansible.builtin.debug:
        msg:
          - "Usuario de ejecucion: {{ pg_usuario_efectivo.stdout | trim }}"
          - "Version del servidor: {{ pg_servidor_version.stdout | trim }}"
          - "Cliente: {{ pg_cliente_version.stdout | trim }}"
          - "Archivo: {{ pg_archivo }}"
          - "Tamano: {{ pg_estado_archivo.stat.size }} bytes"
          - "Retencion: {{ pg_backup_retention_days }} dias"
          - "Respaldos antiguos eliminados: {{ pg_backups_antiguos.matched }}"
