


    
  
    - name: Confirmar que pg_dumpall existe y es ejecutable
      ansible.builtin.assert:
        that:
          - pg_dumpall_info.stat.exists
          - pg_dumpall_info.stat.executable
        fail_msg: 'No se puede ejecutar /bin/pg_dumpall en el servidor.'

    - name: Obtener version del cliente pg_dumpall
      ansible.builtin.command:
        argv:
          - "{{ pg_backup_dumpall_path }}"
          - --version
      become_user: postgres
      register: pg_cliente_version
      changed_when: false

    - name: Verificar acceso local y version del servidor PostgreSQL
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -A
          - -t
          - --no-password
          - -p
          - "{{ pg_backup_port | string }}"
          - -c
          - 'SHOW server_version;'
      become_user: postgres
      register: pg_servidor_version
      changed_when: false

    - name: Crear directorio protegido para respaldos
      ansible.builtin.file:
        path: "{{ pg_backup_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Obtener marca de tiempo UTC
      ansible.builtin.command:
        argv:
          - date
          - -u
          - +%Y%m%dT%H%M%S%NZ
      register: pg_fecha
      changed_when: false

    - name: Definir nombre del respaldo
      ansible.builtin.set_fact:
        pg_archivo: "{{ pg_backup_dir }}/postgresql_all_{{ pg_fecha.stdout }}.sql.gz"

    - name: Respaldar todas las bases y roles y comprimir en GZIP
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            umask 077
            dumpall="$1"
            backup_dir="$2"
            destino="$3"
            puerto="$4"
            temporal="$(mktemp "${backup_dir}/.postgresql_all_XXXXXXXX")"
            trap 'rm -f -- "$temporal"' EXIT
            "$dumpall" --no-password --no-role-passwords --port "$puerto" | gzip -c > "$temporal"
            gzip -t -- "$temporal"
            test -s "$temporal"
            mv -- "$temporal" "$destino"
            trap - EXIT
          - backup_postgresql
          - "{{ pg_backup_dumpall_path }}"
          - "{{ pg_backup_dir }}"
          - "{{ pg_archivo }}"
          - "{{ pg_backup_port | string }}"
      become_user: postgres
      register: pg_backup_resultado
      changed_when: true

    - name: Examinar archivo generado
      ansible.builtin.stat:
        path: "{{ pg_archivo }}"
      register: pg_estado_archivo

    - name: Validar que el respaldo exista y tenga permisos restringidos
      ansible.builtin.assert:
        that:
          - pg_estado_archivo.stat.exists
          - pg_estado_archivo.stat.isreg
          - pg_estado_archivo.stat.size | int > 0
          - pg_estado_archivo.stat.mode == '0600'
        fail_msg: El archivo de respaldo no supera las verificaciones basicas.

    - name: Buscar respaldos anteriores a 7 dias
      ansible.builtin.find:
        paths: "{{ pg_backup_dir }}"
        patterns: 'postgresql_all_*.sql.gz'
        file_type: file
        age: "{{ pg_backup_retention_days }}d"
        recurse: false
      register: pg_backups_antiguos

    - name: Eliminar respaldos vencidos solo despues de un respaldo exitoso
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pg_backups_antiguos.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Mostrar resumen en AWX
      ansible.builtin.debug:
        msg:
          - "Version PostgreSQL: {{ pg_servidor_version.stdout | trim }}"
          - "Cliente: {{ pg_cliente_version.stdout | trim }}"
          - "Respaldo: {{ pg_archivo }}"
          - "Tamano: {{ pg_estado_archivo.stat.size }} bytes"
          - "Retencion: {{ pg_backup_retention_days }} dias"
          - "Archivos vencidos eliminados: {{ pg_backups_antiguos.matched }}"

