
---
- name: Backup PostgreSQL
  gather_facts: false
  become: true
  become_method: sudo
  become_user: postgres

  tasks:
    - name: Respaldar todas las bases de datos
      ansible.builtin.shell: |
        set -o pipefail
        umask 077
        /bin/pg_dumpall --verbose | gzip > /var/backups/postgresql/postgresql_$(date +%Y%m%d_%H%M%S).sql.gz
      args:
        executable: /bin/bash
